services:
  - type: web
    name: skill-exchange-platform
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skill-exchange-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "604800"
      - key: UPLOAD_DIR
        value: uploads/notes

databases:
  - name: skill-exchange-db
    databaseName: skill_exchange
    region: singapore
    plan: free
    postgresMajorVersion: "18"
